[build]
  publish = "site"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/terms/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/privacy/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/refund/*"
  [headers.values]
    X-Frame-Options = "DENY"

[[headers]]
  for = "/contact/*"
  [headers.values]
    X-Frame-Options = "DENY"
