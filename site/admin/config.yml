backend:
  name: git-gateway
  branch: devin/1780932348-add-landing-site

media_folder: "site/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Terms of Service"
        name: "terms"
        file: "site/terms/content.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Last Updated", name: "date", widget: "datetime" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Privacy Policy"
        name: "privacy"
        file: "site/privacy/content.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Last Updated", name: "date", widget: "datetime" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Refund Policy"
        name: "refund"
        file: "site/refund/content.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Last Updated", name: "date", widget: "datetime" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "general"
        file: "site/admin/settings.json"
        fields:
          - { label: "Site Title", name: "site_title", widget: "string", default: "Career Copilot" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "AI-Powered Career Coaching & Interview Practice" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string" }
          - { label: "Contact Email", name: "contact_email", widget: "string" }
